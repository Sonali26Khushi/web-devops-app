name: Build and Push

on:
  push:
    branches: 
      - main
      - update-docker-file

jobs:
  build_push:
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USER}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{vars.DOCKERHUB_USER}}/web-devops-app:latest
            ${{vars.DOCKERHUB_USER}}/web-devops-app:${{github.sha}}
            ${{vars.DOCKERHUB_USER}}/web-devops-app:${{github.ref_name}}