name: Build and Push
on:
  workflow_dispatch:

jobs:
  build_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USER}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Sanitize ref name for Docker tag
        id: tag
        run: echo "ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{vars.DOCKERHUB_USER}}/web-devops-app:latest
            ${{vars.DOCKERHUB_USER}}/web-devops-app:${{github.sha}}
            ${{vars.DOCKERHUB_USER}}/web-devops-app:${{ steps.tag.outputs.ref }}